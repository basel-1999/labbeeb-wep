<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض السبورة - منصة لبيب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #1E1E1E; color: white; }
        #boardCanvas { background-color: white; width: 100%; height: 100%; display: block; }
        @media print {
            header, footer { display: none !important; }
            body { background: white; }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-[#2C2C2C] h-14 flex items-center justify-between px-4 shrink-0">
        <h1 data-i18n-bv="header_title" class="font-bold text-sm sm:text-base">📄 عرض ملخص السبورة</h1>
        <div class="flex items-center gap-3">
            <button onclick="window.print()" data-i18n-bv="print_btn" class="bg-amber-500 text-black text-xs sm:text-sm font-bold px-3 py-1.5 rounded-lg">طباعة / حفظ PDF 🖨️</button>
        </div>
    </header>

    <main class="flex-1 relative bg-[#2A2A2A]">
        <canvas id="boardCanvas"></canvas>
        <div id="loadingMsg" data-i18n-bv="loading_board" class="absolute inset-0 flex items-center justify-center text-white/60 text-sm">جاري تحميل السبورة...</div>
        <div id="emptyMsg" data-i18n-bv="empty_board" class="absolute inset-0 hidden flex items-center justify-center text-white/60 text-sm">لا توجد سبورة محفوظة لهذه الحصة.</div>
    </main>

    <footer class="bg-[#2C2C2C] h-14 flex items-center justify-center gap-4 shrink-0">
        <button onclick="goToPage(currentPage - 1)" id="prevBtn" data-i18n-bv="prev_btn" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg text-sm font-bold">◀ السابقة</button>
        <span id="pageIndicator" class="text-sm font-bold min-w-[80px] text-center">صفحة 1 / 1</span>
        <button onclick="goToPage(currentPage + 1)" id="nextBtn" data-i18n-bv="next_btn" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg text-sm font-bold">التالية ▶</button>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAO-ziORrLtFb5bgS_byXNzLyDB5VIeLLI",
            authDomain: "labeeb-app-2026.firebaseapp.com",
            projectId: "labeeb-app-2026",
            storageBucket: "labeeb-app-2026.firebasestorage.app",
            messagingSenderId: "201953565667",
            appId: "1:201953565667:web:4cee64be63f85e19a99ed6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('sessionId') || '';

        // ==========================================
        // 🌐 نظام الترجمة (i18n)
        // ==========================================
        const translationsBoardViewer = {
            ar: {
                header_title: "📄 عرض ملخص السبورة",
                print_btn: "طباعة / حفظ PDF 🖨️",
                loading_board: "جاري تحميل السبورة...",
                empty_board: "لا توجد سبورة محفوظة لهذه الحصة.",
                prev_btn: "◀ السابقة",
                next_btn: "التالية ▶",
                page_word: "صفحة",
                load_failed: "تعذر تحميل السبورة: "
            },
            en: {
                header_title: "📄 Board Summary Viewer",
                print_btn: "Print / Save PDF 🖨️",
                loading_board: "Loading board...",
                empty_board: "No saved board for this session.",
                prev_btn: "◀ Previous",
                next_btn: "Next ▶",
                page_word: "Page",
                load_failed: "Failed to load board: "
            }
        };
        let currentLangBv = 'ar';

        function tbv(key) {
            return (translationsBoardViewer[currentLangBv] && translationsBoardViewer[currentLangBv][key]) || translationsBoardViewer['ar'][key] || key;
        }

        function applyLanguageBoardViewer(lang) {
            currentLangBv = (lang === 'en') ? 'en' : 'ar';
            document.documentElement.setAttribute('lang', currentLangBv);
            document.documentElement.setAttribute('dir', currentLangBv === 'en' ? 'ltr' : 'rtl');
            document.querySelectorAll('[data-i18n-bv]').forEach((el) => {
                el.innerText = tbv(el.getAttribute('data-i18n-bv'));
            });
        }

        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');

        let pagesData = {}; // { pageIndex: [stroke, stroke, ...] }
        let pageNumbers = [];
        let currentPage = 0;

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // ✨ جلب لغة الطالب وتطبيقها قبل تحميل السبورة
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        applyLanguageBoardViewer(userDoc.data().preferredLanguage || 'ar');
                    } else {
                        applyLanguageBoardViewer('ar');
                    }
                } catch (e) {
                    applyLanguageBoardViewer('ar');
                }
                loadBoard();
            } else {
                window.location.href = '/';
            }
        });

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            renderPage(currentPage);
        }
        window.addEventListener('resize', resizeCanvas);

        async function loadBoard() {
            if (!sessionId) {
                document.getElementById('loadingMsg').classList.add('hidden');
                document.getElementById('emptyMsg').classList.remove('hidden');
                return;
            }
            try {
                const snapshot = await db.collection('sessions').doc(sessionId).collection('strokes').orderBy('createdAt').get();
                pagesData = {};
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const page = data.page || 0;
                    if (!pagesData[page]) pagesData[page] = [];
                    pagesData[page].push(data);
                });
                pageNumbers = Object.keys(pagesData).map(Number).sort((a, b) => a - b);

                document.getElementById('loadingMsg').classList.add('hidden');
                if (pageNumbers.length === 0) {
                    document.getElementById('emptyMsg').classList.remove('hidden');
                    return;
                }
                resizeCanvas();
                goToPage(0);
            } catch (e) {
                document.getElementById('loadingMsg').innerText = tbv('load_failed') + e.message;
            }
        }

        function goToPage(index) {
            if (index < 0 || index >= pageNumbers.length) return;
            currentPage = index;
            renderPage(currentPage);
            document.getElementById('pageIndicator').innerText = `${tbv('page_word')} ${currentPage + 1} / ${pageNumbers.length}`;
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage === pageNumbers.length - 1;
        }

        function renderPage(index) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const pageKey = pageNumbers[index];
            const strokes = pagesData[pageKey] || [];
            strokes.forEach((data) => {
                if (data.type === 'text') {
                    ctx.font = `${data.fontSize || 18}px Cairo, sans-serif`;
                    ctx.fillStyle = data.color;
                    ctx.textBaseline = 'top';
                    ctx.textAlign = 'left';
                    ctx.fillText(data.text, data.dx * canvas.width, data.dy * canvas.height);
                } else if (data.type === 'shape') {
                    drawShape(data.shape, data.startX, data.startY, data.endX, data.endY, data.color, data.strokeWidth);
                } else if (data.points) {
                    drawStroke(data.points);
                }
            });
        }

        function drawStroke(stroke) {
            if (stroke.length < 1) return;
            ctx.beginPath();
            ctx.lineWidth = stroke[0].strokeWidth;
            ctx.lineCap = 'round';
            ctx.strokeStyle = stroke[0].color;
            ctx.moveTo(stroke[0].dx * canvas.width, stroke[0].dy * canvas.height);
            for (let i = 1; i < stroke.length; i++) {
                ctx.lineTo(stroke[i].dx * canvas.width, stroke[i].dy * canvas.height);
            }
            ctx.stroke();
        }

        function drawShape(type, x1, y1, x2, y2, color, width) {
            ctx.beginPath();
            ctx.lineWidth = width;
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const startX = x1 * canvas.width, startY = y1 * canvas.height;
            const endX = x2 * canvas.width, endY = y2 * canvas.height;
            const w = endX - startX, h = endY - startY;
            const size = Math.max(Math.abs(w), Math.abs(h));

            switch (type) {
                case 'rectangle':
                    ctx.strokeRect(startX, startY, w, h);
                    break;
                case 'square': {
                    const s = size;
                    ctx.strokeRect(startX, startY, w < 0 ? -s : s, h < 0 ? -s : s);
                    break;
                }
                case 'circle': {
                    const r = Math.sqrt(w * w + h * h);
                    ctx.arc(startX, startY, r, 0, 2 * Math.PI);
                    ctx.stroke();
                    break;
                }
                case 'ellipse':
                    ctx.ellipse(startX + w / 2, startY + h / 2, Math.abs(w / 2), Math.abs(h / 2), 0, 0, 2 * Math.PI);
                    ctx.stroke();
                    break;
                case 'line':
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                    break;
                case 'arrow': {
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                    const headlen = 15;
                    const angle = Math.atan2(endY - startY, endX - startX);
                    ctx.beginPath();
                    ctx.moveTo(endX, endY);
                    ctx.lineTo(endX - headlen * Math.cos(angle - Math.PI / 6), endY - headlen * Math.sin(angle - Math.PI / 6));
                    ctx.moveTo(endX, endY);
                    ctx.lineTo(endX - headlen * Math.cos(angle + Math.PI / 6), endY - headlen * Math.sin(angle + Math.PI / 6));
                    ctx.stroke();
                    break;
                }
                case 'triangle':
                    ctx.moveTo(startX + w / 2, startY);
                    ctx.lineTo(startX, startY + h);
                    ctx.lineTo(startX + w, startY + h);
                    ctx.closePath();
                    ctx.stroke();
                    break;
                case 'diamond':
                    ctx.moveTo(startX + w / 2, startY);
                    ctx.lineTo(startX + w, startY + h / 2);
                    ctx.lineTo(startX + w / 2, startY + h);
                    ctx.lineTo(startX, startY + h / 2);
                    ctx.closePath();
                    ctx.stroke();
                    break;
                case 'pentagon':
                    drawPolygon(startX + w / 2, startY + h / 2, 5, size / 2);
                    break;
                case 'hexagon':
                    drawPolygon(startX + w / 2, startY + h / 2, 6, size / 2);
                    break;
                case 'star':
                    drawStar(startX + w / 2, startY + h / 2, 5, size / 2, size / 4);
                    break;
                case 'check':
                    ctx.moveTo(startX, startY + h / 2);
                    ctx.lineTo(startX + w / 3, startY + h);
                    ctx.lineTo(startX + w, startY);
                    ctx.stroke();
                    break;
                case 'cross':
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(startX + w, startY + h);
                    ctx.moveTo(startX + w, startY);
                    ctx.lineTo(startX, startY + h);
                    ctx.stroke();
                    break;
                default:
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
            }
        }

        function drawPolygon(cx, cy, sides, radius) {
            if (sides < 3) return;
            ctx.beginPath();
            ctx.moveTo(cx + radius, cy);
            for (let i = 1; i <= sides; i++) {
                ctx.lineTo(cx + radius * Math.cos(i * 2 * Math.PI / sides), cy + radius * Math.sin(i * 2 * Math.PI / sides));
            }
            ctx.closePath();
            ctx.stroke();
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            const step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
                rot += step;
                ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.stroke();
        }
    </script>
</body>
</html>
