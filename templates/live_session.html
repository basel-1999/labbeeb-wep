    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #1E1E1E; color: white; overflow: hidden; }
        #whiteboard { background-color: white; touch-action: none; width: 100%; height: 100%; display: block; cursor: default; }
        
        .modal { display: none; }
        .modal.active { display: flex; }
        .snackbar { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; color: white; font-weight: bold; z-index: 9999; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 80px; opacity: 1; } }

        /* Animations CSS */
        .anim-object { position: absolute; font-size: 100px; z-index: 50; pointer-events: none; animation: popUp 2.5s ease-out forwards; }
        @keyframes popUp { 0% { transform: scale(0) rotate(0deg); opacity: 0; } 20% { transform: scale(1.2) rotate(10deg); opacity: 1; } 80% { transform: scale(1) rotate(0deg); opacity: 1; } 100% { transform: scale(1.5) translateY(-50px); opacity: 0; } }
        .balloon { position: absolute; font-size: 60px; animation: floatUp 3s ease-in forwards; }
        @keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(-20vh) rotate(15deg); opacity: 0; } }
        .firework-particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; animation: explode 1.5s ease-out forwards; }
        @keyframes explode { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
        
        #timerDisplay { font-size: 1.125rem; }
        .max-btn:hover { background-color: rgba(0,0,0,0.2); border-radius: 4px; }
    </style>
</head>

    <!-- Hidden Audio Elements -->
    <audio id="sound_happy" src="/static/sounds/happy.mp3"></audio>
    <audio id="sound_sad" src="/static/sounds/sad.mp3"></audio>
    <audio id="sound_trophy" src="/static/sounds/trophy.mp3"></audio>
    <audio id="sound_balloons" src="/static/sounds/balloons.mp3"></audio>
    <audio id="sound_heart" src="/static/sounds/heart.mp3"></audio>
    <audio id="sound_question" src="/static/sounds/question.mp3"></audio>
    <audio id="sound_fireworks" src="/static/sounds/fireworks.mp3"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAO-ziORrLtFb5bgS_byXNzLyDB5VIeLLI",
            authDomain: "labeeb-app-2026.firebaseapp.com",
            projectId: "labeeb-app-2026",
            storageBucket: "labeeb-app-2026.firebasestorage.app",
            messagingSenderId: "201953565667",
            appId: "1:201953565667:web:4cee64be63f85e19a99ed6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('sessionId') || 'unknown_session';
        const role = urlParams.get('role') || 'student';
        const studentName = urlParams.get('studentName') || 'طالب';
        const isTeacher = role === 'teacher';

        let currentUser = null;
        let selectedColor = 'black';
        let strokeWidth = 4.0;
        let isEraser = false;
        let isTextMode = false;
        let isDrawing = false;
        let currentStroke = [];
        let strokeDocIds = [];
        let currentStrokes = [];
        let isChatOpen = true;
        let unreadMessages = 0;
        let isMuted = false;
        let isScreenSharing = false;
        let screenShareUid = 0;
        let elapsedSeconds = 0; 
        let maxSeconds = 3600;
        let hasShown10MinWarning = false;
        let hasShown2MinWarning = false;
        let sessionTimer = null;
        let agoraEngine = null;
        let localAudioTrack = null;
        let screenShareClient = null;
        const AGORA_APP_ID = "3a54c447b558405da3e87b1177ccc463";

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                initUI();
                initCanvas();
                initAgora();
                startSessionTimer();
                listenToWhiteboard();
                listenToChat();
                listenToSessionState();
                listenToAnimations();
                
                window.addEventListener('beforeunload', async (event) => {
                    if (agoraEngine) await agoraEngine.leave();
                    if (screenShareClient) await screenShareClient.leave();
                    try {
                        const doc = await db.collection('sessions').doc(sessionId).get();
                        if (doc.exists && doc.data().status !== 'completed') {
                            await db.collection('sessions').doc(sessionId).update({
                                'status': 'interrupted',
                                'interruptedBy': isTeacher ? 'teacher' : 'student'
                            });
                        }
                    } catch (e) {}
                });
            } else {
                window.location.href = '/';
            }
        });

        function initUI() {
            document.getElementById('sessionTitle').innerText = isTeacher ? `جلسة مع الطالب: ${studentName}` : 'جلسة مع المعلم';
            if (isTeacher) {
                document.getElementById('teacherToolbar').classList.remove('hidden');
                document.getElementById('undoBtn').classList.remove('hidden');
                document.getElementById('clearBtn').classList.remove('hidden');
            } else {
                document.getElementById('endSessionText').innerText = 'مغادرة الجلسة';
                document.getElementById('endSessionBtn').classList.remove('bg-red-600');
                document.getElementById('endSessionBtn').classList.add('bg-orange-500', 'hover:bg-orange-600');
            }
            document.getElementById('screenShareBtn').classList.remove('hidden');
        }

        // ==========================================
        // 🎨 Whiteboard, Magic Eraser & Text Tool
        // ==========================================
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');

        function initCanvas() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);
            canvas.addEventListener('touchstart', handleTouch);
            canvas.addEventListener('touchmove', handleTouch);
            canvas.addEventListener('touchend', endDraw);
        }

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            redrawCanvas();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height };
        }

        function startDraw(e) {
            if (!isTeacher) return;
            const pos = getMousePos(e);
            
            if (isTextMode) {
                createTextInput(pos.x, pos.y);
                return;
            }
            
            isDrawing = true;
            if (isEraser) {
                eraseStrokeAt(pos.x, pos.y);
            } else {
                currentStroke = [{ dx: pos.x, dy: pos.y, color: selectedColor, strokeWidth: strokeWidth }];
                drawStroke(currentStroke);
            }
        }

        function draw(e) {
            if (!isTeacher || !isDrawing) return;
            const pos = getMousePos(e);
            if (isEraser) {
                eraseStrokeAt(pos.x, pos.y);
            } else {
                const point = { dx: pos.x, dy: pos.y, color: selectedColor, strokeWidth: strokeWidth };
                currentStroke.push(point);
                ctx.beginPath();
                ctx.lineWidth = currentStroke[currentStroke.length - 2].strokeWidth;
                ctx.lineCap = 'round';
                ctx.strokeStyle = currentStroke[currentStroke.length - 2].color;
                ctx.moveTo(currentStroke[currentStroke.length - 2].dx * canvas.width, currentStroke[currentStroke.length - 2].dy * canvas.height);
                ctx.lineTo(point.dx * canvas.width, point.dy * canvas.height);
                ctx.stroke();
            }
        }

        function endDraw() {
            if (!isTeacher || !isDrawing) return;
            isDrawing = false;
            if (!isEraser && !isTextMode && currentStroke.length > 0) {
                db.collection('sessions').doc(sessionId).collection('strokes').add({
                    points: currentStroke,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(e => console.error("Error saving stroke:", e));
                currentStroke = [];
            }
        }

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            if (e.type === 'touchstart') startDraw({ clientX: touch.clientX, clientY: touch.clientY });
            else if (e.type === 'touchmove') draw({ clientX: touch.clientX, clientY: touch.clientY });
        }

        function drawStroke(stroke) {
            if (stroke.length < 1) return;
            ctx.beginPath();
            ctx.lineWidth = stroke[0].strokeWidth;
            ctx.lineCap = 'round';
            ctx.strokeStyle = stroke[0].color;
            ctx.moveTo(stroke[0].dx * canvas.width, stroke[0].dy * canvas.height);
            for (let i = 1; i < stroke.length; i++) {
                ctx.lineTo(stroke[i].dx * canvas.width, stroke[i].dy * canvas.height);
            }
            ctx.stroke();
        }

        function redrawCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function listenToWhiteboard() {
            db.collection('sessions').doc(sessionId).collection('strokes')
                .orderBy('createdAt')
                .onSnapshot((snapshot) => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    strokeDocIds = [];
                    currentStrokes = [];
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        if (data.type === 'text') {
                            ctx.font = `${data.fontSize || 16}px Cairo, sans-serif`;
                            ctx.fillStyle = data.color;
                            ctx.textBaseline = 'top';
                            ctx.textAlign = 'left';
                            ctx.fillText(data.text, data.dx * canvas.width, data.dy * canvas.height);
                            strokeDocIds.push(doc.id);
                            currentStrokes.push({ id: doc.id, type: 'text', dx: data.dx, dy: data.dy, text: data.text, color: data.color, fontSize: data.fontSize || 16 });
                        } else {
                            const points = data.points || [];
                            drawStroke(points);
                            strokeDocIds.push(doc.id);
                            currentStrokes.push({ id: doc.id, points: points });
                        }
                    });
                });
        }

        function createTextInput(x, y) {
            const boardContainer = document.querySelector('.flex-1.relative.bg-white');
            if (!boardContainer) return;
            
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'اكتب ثم اضغط Enter';
            input.style.position = 'absolute';
            input.style.left = (x * canvas.offsetWidth) + 'px';
            input.style.top = (y * canvas.offsetHeight) + 'px';
            input.style.zIndex = 100;
            input.style.fontSize = '16px';
            input.style.color = selectedColor;
            input.style.background = 'rgba(255,255,255,0.9)';
            input.style.border = `1px solid ${selectedColor}`;
            input.style.padding = '2px 4px';
            input.style.fontFamily = 'Cairo, sans-serif';
            input.style.outline = 'none';
            input.style.borderRadius = '4px';
            input.style.minWidth = '100px';
            
            boardContainer.appendChild(input);
            input.focus();

            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    const text = input.value;
                    if (text.trim() !== '') {
                        db.collection('sessions').doc(sessionId).collection('strokes').add({
                            type: 'text',
                            dx: x,
                            dy: y,
                            text: text,
                            color: selectedColor,
                            fontSize: 16,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    input.remove();
                    isTextMode = false;
                    canvas.style.cursor = "default";
                } else if (event.key === 'Escape') {
                    input.remove();
                    isTextMode = false;
                    canvas.style.cursor = "default";
                }
            });
            
            input.addEventListener('blur', () => {
                if (input.parentNode) input.remove();
                isTextMode = false;
            });
        }

        function eraseStrokeAt(x, y) {
            const px = x * canvas.width;
            const py = y * canvas.height;
            for (let i = 0; i < currentStrokes.length; i++) {
                const stroke = currentStrokes[i];
                let hit = false;
                
                if (stroke.type === 'text') {
                    const tx = stroke.dx * canvas.width;
                    const ty = stroke.dy * canvas.height;
                    ctx.font = `${stroke.fontSize || 16}px Cairo, sans-serif`;
                    const textWidth = ctx.measureText(stroke.text).width;
                    if (px >= tx && px <= tx + textWidth && py >= ty && py <= ty + (stroke.fontSize || 16)) {
                        hit = true;
                    }
                } else {
                    for (let j = 0; j < stroke.points.length; j++) {
                        const p = stroke.points[j];
                        const dist = Math.sqrt(Math.pow(px - p.dx * canvas.width, 2) + Math.pow(py - p.dy * canvas.height, 2));
                        if (dist < 20) {
                            hit = true;
                            break;
                        }
                    }
                }
                
                if (hit) {
                    db.collection('sessions').doc(sessionId).collection('strokes').doc(stroke.id).delete();
                    break;
                }
            }
        }

        // ==========================================
        // ⏱️ Timer & Extend (Count Up)
        // ==========================================
        function startSessionTimer() {
            sessionTimer = setInterval(() => {
                elapsedSeconds++;
                updateTimerUI();
                
                if ((maxSeconds - elapsedSeconds) === 600 && !hasShown10MinWarning) {
                    hasShown10MinWarning = true;
                    showSnackBar('⏳ تنبيه: تبقى 10 دقائق على نهاية الحصة.', 'orange');
                }
                if ((maxSeconds - elapsedSeconds) === 120 && !hasShown2MinWarning) {
                    hasShown2MinWarning = true;
                    if (!isTeacher) openModal('extendModal');
                }
                if (elapsedSeconds >= maxSeconds) {
                    clearInterval(sessionTimer);
                    db.collection('sessions').doc(sessionId).update({ 'status': 'completed', 'completedAt': firebase.firestore.FieldValue.serverTimestamp() });
                    showSnackBar('⌛ انتهت مدة الحصة. سيتم إغلاق الجلسة الآن.', 'red');
                    setTimeout(() => window.location.href = '/', 3000);
                }
            }, 1000);
        }

        function updateTimerUI() {
            const h = Math.floor(elapsedSeconds / 3600);
            const m = Math.floor((elapsedSeconds % 3600) / 60);
            const s = elapsedSeconds % 60;
            const format = (n) => n.toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${format(h)}:${format(m)}:${format(s)}`;
        }

        async function extendSession() {
            closeModal('extendModal');

                const res = await fetch(`/api/session/extend/${sessionId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: new URLSearchParams({ 'studentId': currentUser.uid })

                }

                showSnackBar(`❌ ${e.message}`, 'red');
            }
        }

        // ==========================================
        // 🎙️ Agora Audio & Screen Share
        // ==========================================
        async function fetchDynamicToken(channelName, uid) {
            try {
                const response = await fetch(`https://agora-server-59qz.onrender.com/rtc-token?channelName=${channelName}&uid=${uid}`);
                if (response.ok) return (await response.json()).token || '';
                return '';
            } catch (e) { return ''; }
        }

        async function initAgora() {
            try {
                showSnackBar('جاري الاتصال بخوادم الصوت، قد يستغرق ذلك بضع ثوانٍ...', '#D97706');
                const numericUid = Math.abs(hashCode(currentUser.uid)) % 100000;
                const token = await fetchDynamicToken(sessionId, numericUid);
                if (!token) throw new Error('تعذر الحصول على توكن الاتصال. يرجى تحديث الصفحة.');
                agoraEngine = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
                await agoraEngine.setClientRole("host");
                
                agoraEngine.on("user-published", async (user, mediaType) => {
                    await agoraEngine.subscribe(user, mediaType);
                    if (mediaType === "audio") user.audioTrack.play();
                    if (mediaType === "video") {
                        screenShareUid = user.uid;
                        document.getElementById('screenShareContainer').style.display = 'flex';
                        const player = document.getElementById('screenSharePlayer');
                        player.innerHTML = ''; 
                        user.videoTrack.play('screenSharePlayer');
                    }
                });
                
                agoraEngine.on("user-unpublished", (user, mediaType) => {
                    if (mediaType === "video") {
                        document.getElementById('screenShareContainer').style.display = 'none';
                        document.getElementById('screenSharePlayer').innerHTML = ''; 
                    }
                });

                await agoraEngine.join(AGORA_APP_ID, sessionId, token, numericUid);
                let micId = undefined;
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const audioInputs = devices.filter(d => d.kind === 'audioinput');
                    const invalidKeywords = ['stereo', 'mix', 'what u hear', 'wave out', 'loopback', 'system'];
                    const validMic = audioInputs.find(d => !invalidKeywords.some(kw => d.label.toLowerCase().includes(kw)));
                    if (validMic) micId = validMic.deviceId;
                } catch (e) {}

                let attempts = 0;
                while (attempts < 3) {
                    try {
                        localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack({ microphoneId: micId, AEC: true, ANS: true, AGC: true });
                        break; 
                    } catch (micError) { attempts++; await new Promise(r => setTimeout(r, 1000)); }
                }

                if (localAudioTrack) {
                    await agoraEngine.publish([localAudioTrack]);
                    isMuted = false; updateMicUI();
                    showSnackBar('تم الاتصال بالصوت بنجاح! 🎙️', '#10b981');
                    startAudioRecording(localAudioTrack);
                } else { throw new Error('تعذر الوصول إلى الميكروفون بعد عدة محاولات.'); }
            } catch (e) { showSnackBar('تعذر الاتصال بالصوت: ' + e.message, 'red'); }
        }

        async function toggleMute() {
            if (!localAudioTrack) return;
            isMuted = !isMuted;
            localAudioTrack.setMuted(isMuted);

        async function toggleScreenShare() {
            try {
                if (!isScreenSharing) {
                    const numericUid = Math.abs(hashCode(currentUser.uid)) % 100000;
                    const screenShareUidLocal = numericUid + 1000000; 
                    const token = await fetchDynamicToken(sessionId, screenShareUidLocal);
                    screenShareClient = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
                    await screenShareClient.join(AGORA_APP_ID, sessionId, token || null, screenShareUidLocal);
                    const screenTrack = await AgoraRTC.createScreenVideoTrack({ encoderConfig: "1080p_1", optimizationMode: "detail" }, "disable");
                    await screenShareClient.publish(screenTrack);
                    isScreenSharing = true;
                    await db.collection('sessions').doc(sessionId).update({ isScreenSharing: true, screenShareUid: currentUser.uid });
                    document.getElementById('screenShareContainer').style.display = 'none'; // إخفاء المربع عند المرسل
                    showSnackBar('تم بدء مشاركة الشاشة بنجاح', 'green');
                } else {
                    await stopMyScreenShare();
                    await db.collection('sessions').doc(sessionId).update({ isScreenSharing: false, screenShareUid: null });
                    showSnackBar('تم إيقاف مشاركة الشاشة', 'orange');
                }
            } catch (e) {
                if (screenShareClient) { await screenShareClient.leave(); screenShareClient = null; }
                isScreenSharing = false;
                showSnackBar('فشل مشاركة الشاشة: ' + e.message, 'red');
            }
        }

            if (screenShareClient) { await screenShareClient.leave(); screenShareClient = null; }

        function listenToSessionState() {
            db.collection('sessions').doc(sessionId).onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.status === 'completed') {
                        showSnackBar('⌛ تم إنهاء الجلسة من قبل الطرف الآخر. سيتم الخروج الآن.', 'red');
                        if (agoraEngine) agoraEngine.leave();
                        if (screenShareClient) screenShareClient.leave();
                        clearInterval(sessionTimer);
                        setTimeout(() => window.location.href = isTeacher ? '/teacher-dashboard' : '/student-dashboard', 2000);
                        return;
                    }
                    if (data.status === 'interrupted') {
                        if (!isTeacher && data.interruptedBy === 'teacher') {
                            showSnackBar('❌ انقطع اتصال المعلم، سيتم تحويلك للوحة التحكم.', 'red');
                            clearInterval(sessionTimer);
                            setTimeout(() => window.location.href = '/student-dashboard', 3000);
                        } else if (isTeacher && data.interruptedBy === 'student') {
                            showSnackBar('⚠️ انقطع اتصال الطالب بالإنترنت. يمكنك حفظ السبورة وإنهاء الجلسة.', 'orange');
                        }
                    }
                    
                    // التحكم بالمربع بناءً على من يشارك (يظهر للطرف المعاكس فقط)
                    if (data.isScreenSharing && data.screenShareUid !== currentUser.uid && isScreenSharing) {
                        stopMyScreenShare();
                    }
                    
                    if (!data.isScreenSharing) {
                        document.getElementById('screenShareContainer').style.display = 'none';
                    } else if (data.screenShareUid !== currentUser.uid) {
                        // أنا الطرف المستقبل، أظهر المربع
                        document.getElementById('screenShareContainer').style.display = 'flex';
                    } else {
                        // أنا الطرف الذي يشارك، أخفي المربع عني
                        document.getElementById('screenShareContainer').style.display = 'none';
                    }
                }
            });
        }

        function listenToAnimations() {
            db.collection('sessions').doc(sessionId).collection('animations').orderBy('createdAt', 'desc').limit(1).onSnapshot((snapshot) => {
                // ✨ لو هي أول مرة يحمل فيها الداتا بيز، ما نشغلش أي حاجة

        function playAnimation(type) {
            const overlay = document.getElementById('animationOverlay');
            const sound = document.getElementById(`sound_${type}`);
            if (sound) sound.play();
            if (type === 'fireworks') {
                for (let i = 0; i < 50; i++) {
                    const p = document.createElement('div'); p.className = 'firework-particle';
                    p.style.left = Math.random() * 100 + '%'; p.style.top = Math.random() * 100 + '%';
                    p.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    p.style.transform = `translate(${Math.random() * 200 - 100}px, ${Math.random() * 200 - 100}px)`;
                    overlay.appendChild(p); setTimeout(() => p.remove(), 1500);
                }
            } else if (type === 'balloons') {
                for (let i = 0; i < 15; i++) {
                    const b = document.createElement('div'); b.className = 'balloon';
                    b.style.left = Math.random() * 100 + '%'; b.style.animationDelay = Math.random() * 1 + 's';
                    b.innerText = ['🎈', '🎈', '🎈', '🎉'][Math.floor(Math.random() * 4)];

                }

                const el = document.createElement('div'); el.className = 'anim-object';

                else if (type === 'heart') el.innerText = '❤️';
                else if (type === 'happy') el.innerText = '😊';
                else if (type === 'sad') el.innerText = '😢';
                else if (type === 'question') {
                    const span = document.createElement('span'); span.innerText = '❓';
                    span.style.display = 'inline-block'; span.style.transform = 'scaleX(-1)';
                    el.appendChild(span);
                }
                overlay.appendChild(el); setTimeout(() => el.remove(), 2500);
            }
        }

        // ==========================================
        // 📄 PDF Generation & End Session
        // ==========================================
        let mediaRecorder, audioChunks = [];
        function startAudioRecording(track) {
            try {
                const mediaStream = new MediaStream([track.getMediaStreamTrack()]);
                mediaRecorder = new MediaRecorder(mediaStream, { audioBitsPerSecond: 16000 });
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.start();
            } catch (e) {}
        }
        
        async function stopAudioRecording() {
            return new Promise((resolve) => {
                if (!mediaRecorder || mediaRecorder.state === 'inactive') { resolve(null); return; }
                mediaRecorder.onstop = () => { resolve(new File([new Blob(audioChunks, { type: 'audio/mp3' })], `session_${sessionId}_audio.mp3`, { type: 'audio/mp3' })); };
                mediaRecorder.stop();
            });
        }
        
        function confirmEndSession() {
            if (isTeacher) openModal('endSessionModal');
            else { db.collection('sessions').doc(sessionId).update({ 'status': 'completed', 'completedAt': firebase.firestore.FieldValue.serverTimestamp() }); window.location.href = '/student-dashboard'; }
        }
        
        async function startExportProcess() {
            document.getElementById('endModalContent').classList.add('hidden');
            document.getElementById('endModalProgress').classList.remove('hidden');
            updateProgress(0.15, 'جاري التقاط صورة السبورة...');
            try {
                const canvasImg = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                pdf.addImage(canvasImg, 'PNG', 0, 0, 210, 297);
                const pdfBlob = pdf.output('blob');
                updateProgress(0.35, 'جاري إيقاف التسجيل الصوتي...');
                const audioFile = await stopAudioRecording();
                updateProgress(0.55, 'جاري رفع الملفات للسيرفر...');
                const token = await currentUser.getIdToken();
                const formData = new FormData();
                formData.append('pdf', pdfBlob, `session_${sessionId}_board.pdf`);
                if (audioFile) formData.append('audio', audioFile, audioFile.name);
                const res = await fetch(`/api/session/complete/${sessionId}`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData });
                if (!res.ok) throw new Error('فشل حفظ الجلسة في السيرفر');
                updateProgress(0.90, 'تم الرفع بنجاح، جاري إغلاق الاتصال...');
                if (agoraEngine) await agoraEngine.leave();
                if (screenShareClient) await screenShareClient.leave();
                updateProgress(1.0, 'تم الانتهاء بنجاح! جاري تحويلك...');
                setTimeout(() => window.location.href = '/teacher-dashboard', 500);
            } catch (e) { showSnackBar('حدث خطأ أثناء الإغلاق: ' + e.message, 'red'); closeModal('endSessionModal'); }
        }
        
        function updateProgress(val, text) { document.getElementById('progressBar').style.width = `${val * 100}%`; document.getElementById('progressPercent').innerText = `${Math.round(val * 100)}%`; document.getElementById('progressStatus').innerText = text; }

        // ==========================================
        // 🛠️ Utilities
        // ==========================================
        function hashCode(str) { let hash = 0; for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash = hash & hash; } return Math.abs(hash); }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function showSnackBar(text, color) {
            const colors = { green: '#10b981', red: '#ef4444', orange: '#f59e0b' };
            const snackbar = document.createElement('div'); snackbar.className = 'snackbar';
            snackbar.style.backgroundColor = colors[color] || '#333'; snackbar.innerText = text;
            document.body.appendChild(snackbar); setTimeout(() => snackbar.remove(), 3000);
        }
    </script>
</body>
</html>
