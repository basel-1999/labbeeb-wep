    <!DOCTYPE html>
    <html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>غرفة البث المباشر - منصة لبيب</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
        <!-- Firebase -->
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
        <!-- Agora Web SDK -->
        <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            oliveGreen: '#4E6B45',
                            accentOrange: '#D97706',
                        },
                        fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                    }
                }
            }
        </script>
        <style>
            body { font-family: 'Cairo', sans-serif; background-color: #1E1E1E; color: white; overflow: hidden; }
            html[lang="en"] body { font-family: 'Inter', sans-serif; }
            #whiteboard { background-color: white; touch-action: none; width: 100%; height: 100%; display: block; cursor: default; }
            
            .modal { display: none; }
            .modal.active { display: flex; }
            .snackbar { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; color: white; font-weight: bold; z-index: 9999; animation: slideUp 0.3s ease-out; }
            @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 80px; opacity: 1; } }

            /* Animations CSS */
            .anim-object { position: absolute; font-size: 100px; z-index: 50; pointer-events: none; animation: popUp 2.5s ease-out forwards; }
            @keyframes popUp { 0% { transform: scale(0) rotate(0deg); opacity: 0; } 20% { transform: scale(1.2) rotate(10deg); opacity: 1; } 80% { transform: scale(1) rotate(0deg); opacity: 1; } 100% { transform: scale(1.5) translateY(-50px); opacity: 0; } }
            .balloon { position: absolute; font-size: 60px; animation: floatUp 3s ease-in forwards; }
            @keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(-20vh) rotate(15deg); opacity: 0; } }
            .firework-particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; animation: explode 1.5s ease-out forwards; }
            @keyframes explode { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
            
            #timerDisplay { font-size: 1.125rem; }

            /* ضبط أبعاد الفيديو */
            #screenSharePlayer video {
                object-fit: contain !important;
                width: 100% !important;
                height: 100% !important;
            }

            /* تنسيق قائمة الإيموجيز */
            #emojiPicker { display: none; }

            /* 👆 مؤشر الطرف الآخر (يظهر عند الطالب لما يحرك المعلم مؤشره) */
            #remotePointer {
                position: absolute;
                display: none;
                pointer-events: none;
                z-index: 60;
                line-height: 1;
                transform: translate(-50%, -50%);
                transition: left 0.1s linear, top 0.1s linear;
                text-shadow: 0 1px 3px rgba(0,0,0,0.35);
            }

            /* ✨ أنميشن مضيء للحصة التجريبية */
            @keyframes blinkTrial {
                0% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.3; transform: scale(0.95); }
                100% { opacity: 1; transform: scale(1); }
            }
            .trial-live-badge {
                animation: blinkTrial 1.2s infinite;
                background-color: #059669;
                color: #FFFFFF;
                font-weight: 900;
                padding: 6px 14px;
                border-radius: 8px;
                font-size: 14px;
                box-shadow: 0 0 15px rgba(5, 150, 105, 0.7);
                border: 1px solid #10b981;
                display: none; /* مخفي افتراضياً */
            }


            /* ⭐ ===== نظام المكافآت ===== */
            #rewardTrophies { --tw: clamp(58px, min(11vh, 10vw), 108px); position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; z-index: 35; }
            .trophy-wrap { position: relative; width: var(--tw); }
            .trophy-wrap.cup { width: calc(var(--tw) * 1.12); }
            .trophy-item { transition: filter .5s ease; }
            .trophy-item svg { width: 100%; height: auto; display: block; overflow: visible; }
            .trophy-item.locked { filter: grayscale(.9) opacity(.55); }
            .trophy-item.current { filter: drop-shadow(0 0 10px rgba(255,190,0,.95)); }
            .trophy-item.done { filter: drop-shadow(0 0 6px rgba(255,215,90,.7)); }
            #cupsBadge { position: absolute; top: 0; left: -6px; display: none; align-items: center; gap: 2px; background: #fff; border: 2px solid #E0A000; border-radius: 999px; padding: 1px 8px 1px 3px; font-weight: 900; font-size: 12px; color: #8A5300; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
            #cupsBadge svg { width: 18px; height: 21px; }

            .slot-fill { opacity: 0; transform-box: fill-box; transform-origin: center; }
            .slot-fill.on { opacity: 1; }
            @keyframes slotPop { 0% { transform: scale(.2); } 60% { transform: scale(1.4); } 100% { transform: scale(1); } }
            .slot-fill.pop { animation: slotPop .45s cubic-bezier(.2,.9,.3,1.3); }

            #rewardStage { position: absolute; inset: 0; display: none; z-index: 60; pointer-events: none; overflow: hidden; }
            #rewardBackdrop { position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(0,0,0,.2), rgba(0,0,0,.6)); opacity: 0; }
            .reward-big { position: absolute; display: none; left: 50%; top: 44%; width: var(--rw); height: var(--rh); margin-left: calc(var(--rw) / -2); margin-top: calc(var(--rh) / -2); }
            .reward-big svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
            #rewardBigStar { --rh: min(220px, 34vh); --rw: min(220px, 34vh); }
            #rewardBigSilver, #rewardBigGold { --rh: min(300px, 46vh); --rw: calc(min(300px, 46vh) * .706); }
            #rewardBigCup { --rh: min(330px, 50vh); --rw: calc(min(330px, 50vh) * .842); }
            #rewardRays { position: absolute; display: none; opacity: 0; transition: opacity .6s; left: 50%; top: 44%; width: min(620px, 90vh); height: min(620px, 90vh); margin-left: calc(min(620px, 90vh) / -2); margin-top: calc(min(620px, 90vh) / -2); border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,230,120,.38) 0deg 9deg, rgba(255,230,120,0) 9deg 18deg); -webkit-mask-image: radial-gradient(circle, #000 18%, transparent 68%); mask-image: radial-gradient(circle, #000 18%, transparent 68%); animation: raysSpin 14s linear infinite; }
            @keyframes raysSpin { to { transform: rotate(360deg); } }
            #rewardCaption { position: absolute; left: 0; right: 0; top: calc(44% + min(190px, 28vh)); text-align: center; font-weight: 900; font-size: clamp(22px, 4vw, 40px); color: #fff; text-shadow: 0 3px 12px rgba(0,0,0,.6), 0 0 24px rgba(255,200,0,.6); opacity: 0; }
            .reward-particle { position: absolute; left: 50%; top: 44%; pointer-events: none; }
            #awardStarBtn:disabled { opacity: .5; cursor: not-allowed; }
            
            /* 💬 سهم الإرسال: بيتجه حسب لغة الصفحة */
            html[lang="en"] #sendArrow { transform: scaleX(-1); }

        </style>
    </head>
    <body class="h-screen flex flex-col">

        <!-- App Bar -->
        <header class="bg-[#2C2C2C] h-14 flex items-center justify-between px-4 z-10 shrink-0">
            <div class="flex items-center bg-black/40 rounded-lg px-3 py-1.5 border border-white/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-400 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span id="timerDisplay" class="font-bold text-amber-400">00:00:00</span>
            </div>

            <div id="pointsDisplayContainer" class="flex items-center bg-black/40 rounded-lg px-3 py-1.5 border border-white/20 hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-400 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.196-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>
                <span id="pointsDisplay" class="font-bold text-amber-400">0 نقطة</span>
            </div>

            <div class="flex items-center gap-2">
                <svg id="micStatusIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>
                <span id="sessionTitle" data-i18n-l="session_with_teacher" class="text-sm font-medium">جلسة مع المعلم</span>
                <!-- ✨ شارة الحصة التجريبية المضيئة -->
                <div id="freeTrialLiveBadge" class="trial-live-badge" data-i18n-l="trial_badge_text">🚀 حصة تجريبية مجانية</div>
            </div>

            <div class="flex items-center gap-2 relative">
                <button id="undoBtn" onclick="undoStroke()" class="p-2 hover:bg-white/10 rounded-lg hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" /></svg>
                </button>
                <button id="clearBtn" onclick="confirmClearBoard()" class="p-2 hover:bg-white/10 rounded-lg hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
                <button id="newPageBtn" onclick="startNewPage()" class="p-2 hover:bg-white/10 rounded-lg hidden flex items-center gap-1 text-xs text-white/80" title="حفظ السبورة الحالية والانتقال لصفحة جديدة">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                    <span id="pageCounterLabel" data-i18n-l="new_page_btn">صفحة جديدة</span>
                </button>
                <button id="allowStudentScreenShareBtn" onclick="toggleAllowStudentScreenShare()" class="hidden p-2 rounded-lg bg-white/10 hover:bg-white/20 flex items-center gap-1 text-xs text-white/80" title="السماح للطالب بمشاركة الشاشة">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                    <span id="allowScreenShareLabel" data-i18n-l="allow_screen_share_label">السماح بمشاركة الشاشة</span>
                </button>
                <button id="allowStudentDrawBtn" onclick="toggleAllowStudentDraw()" class="hidden p-2 rounded-lg bg-white/10 hover:bg-white/20 flex items-center gap-1 text-xs text-white/80" title="السماح للطالب بالرسم">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                    <span id="allowDrawLabel" data-i18n-l="allow_draw_label">السماح بالرسم</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex overflow-hidden relative">
            
            <!-- Whiteboard Area -->
            <div class="flex-1 flex flex-col">
                <!-- Toolbar (Teacher Only) -->
                <div id="teacherToolbar" class="bg-[#2A2A2A] h-12 flex items-center px-4 gap-2 shrink-0 z-30 hidden relative flex-wrap">
                    <span data-i18n-l="colors_label" class="text-sm text-white/70 ml-2">الألوان:</span>
                    
                    <button onclick="selectColor('black')" class="w-7 h-7 rounded-full bg-black border-2 border-white/30 shrink-0"></button>
                    <button onclick="selectColor('red')" class="w-7 h-7 rounded-full bg-red-500 border-2 border-white/30 shrink-0"></button>
                    <button onclick="selectColor('blue')" class="w-7 h-7 rounded-full bg-blue-500 border-2 border-white/30 shrink-0"></button>
                    <button onclick="selectColor('green')" class="w-7 h-7 rounded-full bg-green-500 border-2 border-white/30 shrink-0"></button>
                    <!-- الألوان الجديدة المضافة -->
                    <button onclick="selectColor('orange')" class="w-7 h-7 rounded-full bg-orange-500 border-2 border-white/30 shrink-0" title="برتقالي"></button>
                    <button onclick="selectColor('purple')" class="w-7 h-7 rounded-full bg-purple-500 border-2 border-white/30 shrink-0" title="بنفسجي"></button>
                    <button onclick="selectColor('#ec4899')" class="w-7 h-7 rounded-full bg-pink-500 border-2 border-white/30 shrink-0" title="وردي"></button>
                    <button onclick="selectColor('#eab308')" class="w-7 h-7 rounded-full bg-yellow-500 border-2 border-white/30 shrink-0" title="أصفر"></button>       


                    <div id="sizePopup" class="flex items-center gap-2 bg-gray-700 px-2 py-1 rounded-lg ml-2" style="display: none;">
                        <button onclick="selectSize(8)" class="w-6 h-6 rounded-full bg-white border-2 border-black" title="عريض"></button>
                        <button onclick="selectSize(4)" class="w-4 h-4 rounded-full bg-white border-2 border-black" title="وسط"></button>
                        <button onclick="selectSize(2)" class="w-2 h-2 rounded-full bg-white border-2 border-black" title="رفيع"></button>
                    </div>

                    <!-- زر القلم -->
                    <button onclick="enablePen()" class="px-3 py-1 border border-white/20 text-white/70 text-xs rounded-md flex items-center gap-1 shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" /></svg> <span data-i18n-l="pen_btn">قلم</span>
                    </button>

                    <!-- زر الأشكال الهندسية -->
                    <div class="relative inline-block">
                        <button onclick="toggleShapeMenu()" class="px-3 py-1 border border-white/20 text-white/70 text-xs rounded-md flex items-center gap-1 shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5z" /></svg>
                            <span id="currentShapeLabel" data-i18n-l="shapes_btn">أشكال</span>
                        </button>
                        <div id="shapeMenu" class="absolute top-full right-0 mt-1 bg-gray-800 p-2 rounded-lg shadow-xl z-50 border border-white/20 grid grid-cols-4 gap-2 w-64" style="display: none;">
                             <button onclick="selectShape('rectangle')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="مستطيل">
                                <span class="text-lg">▭</span> <span data-i18n-l="rectangle">مستطيل</span>
                            </button>
                            <button onclick="selectShape('square')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="مربع">
                                <span class="text-lg">⏹</span> <span data-i18n-l="square">مربع</span>
                            </button>
                            <button onclick="selectShape('circle')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="دائرة">
                                <span class="text-lg">◯</span> <span data-i18n-l="circle">دائرة</span>
                            </button>
                            <button onclick="selectShape('ellipse')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="بيضاوي">
                                <span class="text-lg">⬏</span> <span data-i18n-l="ellipse">بيضاوي</span>
                            </button>
                            <button onclick="selectShape('line')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="خط مستقيم">
                                <span class="text-lg">╱</span> <span data-i18n-l="line_shape">خط</span>
                            </button>
                            <button onclick="selectShape('arrow')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="سهم">
                                <span class="text-lg">➔</span> <span data-i18n-l="arrow">سهم</span>
                            </button>
                            <button onclick="selectShape('triangle')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="مثلث">
                                <span class="text-lg">△</span> <span data-i18n-l="triangle">مثلث</span>
                            </button>
                            <button onclick="selectShape('diamond')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="معين">
                                <span class="text-lg">◇</span> <span data-i18n-l="diamond">معين</span>
                            </button>
                            <button onclick="selectShape('pentagon')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="خماسي">
                                <span class="text-lg">⬠</span> <span data-i18n-l="pentagon">خماسي</span>
                            </button>
                            <button onclick="selectShape('hexagon')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="سداسي">
                                <span class="text-lg">⬡</span> <span data-i18n-l="hexagon">سداسي</span>
                            </button>
                            <button onclick="selectShape('star')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="نجمة">
                                <span class="text-lg">☆</span> <span data-i18n-l="star">نجمة</span>
                            </button>
                            <button onclick="selectShape('check')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="علامة صح">
                                <span class="text-lg text-green-400">✓</span> <span data-i18n-l="check_mark">صح</span>
                            </button>
                            <button onclick="selectShape('cross')" class="flex flex-col items-center justify-center p-2 hover:bg-white/10 rounded text-xs text-white" title="علامة خطأ">
                                <span class="text-lg text-red-400">✕</span> <span data-i18n-l="cross_mark">خطأ</span>
                            </button>
                        </div>
                    </div>

                    <!-- زر المؤشر مع القائمة المنسدلة المحدثة -->
                    <div class="relative inline-block">
                        <button onclick="togglePointerMenu()" class="px-3 py-1 border border-white/20 text-white/70 text-xs rounded-md flex items-center gap-1 shrink-0">
                            <span id="currentPointerIcon" class="text-lg">👆</span> <span data-i18n-l="pointer_btn">مؤشر</span>
                        </button>
                        <!-- القائمة المنسدلة الآن تطفو بوضوح فوق السبورة مع z-50 -->
                        <div id="pointerMenu" class="absolute top-full right-0 mt-1 bg-gray-800 p-2 rounded-lg shadow-xl z-50 border border-white/20 flex flex-col gap-2" style="display: none;">
                            <div class="flex gap-1">
                                <button onclick="setPointerEmoji('👈')" class="text-2xl p-1 hover:bg-white/10 rounded">👈</button>
                                <button onclick="setPointerEmoji('👉')" class="text-2xl p-1 hover:bg-white/10 rounded">👉</button>
                                <button onclick="setPointerEmoji('👆')" class="text-2xl p-1 hover:bg-white/10 rounded">👆</button>
                                <button onclick="setPointerEmoji('👇')" class="text-2xl p-1 hover:bg-white/10 rounded">👇</button>
                                <button onclick="setPointerEmoji('☝️')" class="text-2xl p-1 hover:bg-white/10 rounded">☝️</button>
                            </div>
                            <div class="flex items-center gap-2 justify-center border-t border-white/20 pt-2">
                                <button onclick="changePointerSize(-8)" class="text-white bg-gray-700 w-8 h-8 rounded hover:bg-gray-600 font-bold">-</button>
                                <span id="pointerSizeDisplay" class="text-white text-sm w-12 text-center">48px</span>
                                <button onclick="changePointerSize(8)" class="text-white bg-gray-700 w-8 h-8 rounded hover:bg-gray-600 font-bold">+</button>
                            </div>
                        </div>

        let recordingAudioContext = null;

        function initAudioMixGraph(localTrack) {
            try {
                recordingAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                recordingDestination = recordingAudioContext.createMediaStreamDestination();
                recordingAudioContext.resume().catch(() => {});

                const localSource = recordingAudioContext.createMediaStreamSource(
                    new MediaStream([localTrack.getMediaStreamTrack()])
                );
                localSource.connect(recordingDestination);
            } catch (e) {
                console.error('Failed to init audio mix graph:', e);
            }
        }

        function addRemoteAudioToMix(uid, remoteAudioTrack) {
            if (!recordingAudioContext || !recordingDestination) return;
            try {
                const remoteStream = new MediaStream([remoteAudioTrack.getMediaStreamTrack()]);
                const remoteSource = recordingAudioContext.createMediaStreamSource(remoteStream);
                remoteSource.connect(recordingDestination);
                remoteAudioSourceNodes[uid] = remoteSource;
            } catch (e) {
                console.error('Failed to add remote audio to mix:', e);
            }
        }

function handleDoubleClick(e) { if (!canDraw()) return;

            function resizeCanvas() {

            }

            function getTextAtPosition(px, py) {
                for (let i = currentStrokes.length - 1; i >= 0; i--) {

                    if (s.type === 'text') {
                        ctx.font = `${s.fontSize || 18}px Cairo, sans-serif`;
                        const textWidth = ctx.measureText(s.text).width;
                        const tx = s.dx * canvas.width;
                        const ty = s.dy * canvas.height;
                        if (px >= tx - 5 && px <= tx + textWidth + 5 && py >= ty - 5 && py <= ty + (s.fontSize || 18) + 5) {

            function startDraw(e) { if (!canDraw()) return;

                    dragOffsetY = py - (hitText.dy * canvas.height);

                    canvas.style.cursor = "grabbing";
                    return;
                }

                if (isTextMode) {

                }

                if (isShapeMode) {
                    isDrawing = true;
                    shapeStartPos = { x: pos.x, y: pos.y };
                    return;
                }

                isDrawing = true;
                currentStroke = [{ dx: pos.x, dy: pos.y, color: selectedColor, strokeWidth: strokeWidth }];

                function draw(e) { if (!canDraw() || !isDrawing) return;

                    ctx.strokeStyle = currentStroke[currentStroke.length - 2].color;

                    const newDy = (pos.y * canvas.height - dragOffsetY) / canvas.height;
                    
                    db.collection('sessions').doc(sessionId).collection('strokes').doc(draggingTextId).update({

            function drawStroke(stroke) {
                if (stroke.length < 1) return;
                ctx.beginPath();
                ctx.lineWidth = stroke[0].strokeWidth;
                ctx.lineCap = 'round';
                ctx.strokeStyle = stroke[0].color;
                ctx.moveTo(stroke[0].dx * canvas.width, stroke[0].dy * canvas.height);

            function drawShape(type, x1, y1, x2, y2, color, width) {
                ctx.beginPath();
                ctx.lineWidth = width;
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const startX = x1 * canvas.width;
                const startY = y1 * canvas.height;
                const endX = x2 * canvas.width;
                const endY = y2 * canvas.height;
                const w = endX - startX;
                const h = endY - startY;

                switch(type) {
                    case 'rectangle':
                        ctx.strokeRect(startX, startY, w, h);
                        break;
                    case 'square':
                        const side = Math.max(Math.abs(w), Math.abs(h));
                        ctx.strokeRect(startX, startY, w < 0 ? -side : side, h < 0 ? -side : side);
                        break;
                    case 'circle':
                        const radius = Math.sqrt(w * w + h * h);
                        ctx.beginPath();
                        ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
                        ctx.stroke();
                        break;
                    case 'ellipse':
                        ctx.beginPath();
                        ctx.ellipse(startX + w / 2, startY + h / 2, Math.abs(w / 2), Math.abs(h / 2), 0, 0, 2 * Math.PI);
                        ctx.stroke();
                        break;
                    case 'line':
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.lineTo(endX, endY);
                        ctx.stroke();
                        break;
                    case 'arrow':
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.lineTo(endX, endY);
                        ctx.stroke();
                        const headlen = 15;
                        const angle = Math.atan2(endY - startY, endX - startX);
                        ctx.beginPath();
                        ctx.moveTo(endX, endY);
                        ctx.lineTo(endX - headlen * Math.cos(angle - Math.PI / 6), endY - headlen * Math.sin(angle - Math.PI / 6));
                        ctx.moveTo(endX, endY);
                        ctx.lineTo(endX - headlen * Math.cos(angle + Math.PI / 6), endY - headlen * Math.sin(angle + Math.PI / 6));
                        ctx.stroke();
                        break;
                    case 'triangle':
                        ctx.beginPath();
                        ctx.moveTo(startX + w / 2, startY);
                        ctx.lineTo(startX, startY + h);
                        ctx.lineTo(startX + w, startY + h);
                        ctx.closePath();
                        ctx.stroke();
                        break;
                    case 'diamond':
                        ctx.beginPath();
                        ctx.moveTo(startX + w / 2, startY);
                        ctx.lineTo(startX + w, startY + h / 2);
                        ctx.lineTo(startX + w / 2, startY + h);
                        ctx.lineTo(startX, startY + h / 2);
                        ctx.closePath();
                        ctx.stroke();
                        break;
                    case 'pentagon':
                        drawPolygon(startX + w / 2, startY + h / 2, 5, Math.max(Math.abs(w), Math.abs(h)) / 2);
                        break;
                    case 'hexagon':
                        drawPolygon(startX + w / 2, startY + h / 2, 6, Math.max(Math.abs(w), Math.abs(h)) / 2);
                        break;
                    case 'star':
                        drawStar(startX + w / 2, startY + h / 2, 5, Math.max(Math.abs(w), Math.abs(h)) / 2, Math.max(Math.abs(w), Math.abs(h)) / 4);
                        break;
                    case 'check':
                        ctx.beginPath();
                        ctx.moveTo(startX, startY + h / 2);
                        ctx.lineTo(startX + w / 3, startY + h);
                        ctx.lineTo(startX + w, startY);
                        ctx.stroke();
                        break;
                    case 'cross':
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.lineTo(startX + w, startY + h);
                        ctx.moveTo(startX + w, startY);
                        ctx.lineTo(startX, startY + h);
                        ctx.stroke();
                        break;
                }
            }

            function drawPolygon(cx, cy, sides, radius) {
                if (sides < 3) return;
                ctx.beginPath();
                ctx.moveTo(cx + radius * Math.cos(0), cy + radius * Math.sin(0));
                for (let i = 1; i <= sides; i++) {
                    ctx.lineTo(cx + radius * Math.cos(i * 2 * Math.PI / sides), cy + radius * Math.sin(i * 2 * Math.PI / sides));
                }
                ctx.closePath();
                ctx.stroke();
            }

            function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
                let rot = Math.PI / 2 * 3;
                let x = cx;
                let y = cy;
                let step = Math.PI / spikes;

                ctx.beginPath();
                ctx.moveTo(cx, cy - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    x = cx + Math.cos(rot) * outerRadius;
                    y = cy + Math.sin(rot) * outerRadius;
                    ctx.lineTo(x, y);
                    rot += step;

                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                }
                ctx.lineTo(cx, cy - outerRadius);
                ctx.closePath();
                ctx.stroke();
            }

            function drawShapePreview(type, x1, y1, x2, y2, color, width) {
                ctx.save();

                drawShape(type, x1, y1, x2, y2, color, width);

            function redrawAllStrokes() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                currentStrokes.forEach(s => {
                    if (s.type === 'text') {
                        ctx.font = `${s.fontSize || 18}px Cairo, sans-serif`;
                        ctx.fillStyle = s.color;
                        ctx.textBaseline = 'top';
                        ctx.textAlign = 'left';
                        ctx.fillText(s.text, s.dx * canvas.width, s.dy * canvas.height);
                    } else if (s.type === 'shape') {
                        drawShape(s.shape, s.startX, s.startY, s.endX, s.endY, s.color, s.strokeWidth);
                    } else {
                        drawStroke(s.points);
                    }
                });
            }

            function redrawCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function listenToWhiteboard() {

        function renderCurrentPageStrokes() {
            if (!lastWhiteboardSnapshot) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            strokeDocIds = [];
            currentStrokes = [];
            lastWhiteboardSnapshot.forEach((doc) => {
                const data = doc.data();
                const docPage = data.page || 0;
                if (docPage !== currentPageIndex) return; // نعرض فقط نقاط الصفحة الحالية

                if (data.type === 'text') {
                    ctx.font = `${data.fontSize || 18}px Cairo, sans-serif`;
                    ctx.fillStyle = data.color;
                    ctx.textBaseline = 'top';
                    ctx.textAlign = 'left';
                    ctx.fillText(data.text, data.dx * canvas.width, data.dy * canvas.height);
                    strokeDocIds.push(doc.id);
                    currentStrokes.push({ id: doc.id, type: 'text', dx: data.dx, dy: data.dy, text: data.text, color: data.color, fontSize: data.fontSize || 18, author: data.author });
                } else if (data.type === 'shape') {
                    drawShape(data.shape, data.startX, data.startY, data.endX, data.endY, data.color, data.strokeWidth);
                    strokeDocIds.push(doc.id);
                    currentStrokes.push({ id: doc.id, type: 'shape', shape: data.shape, startX: data.startX, startY: data.startY, endX: data.endX, endY: data.endY, color: data.color, strokeWidth: data.strokeWidth, author: data.author });
                } else {
                    const points = data.points || [];
                    drawStroke(points);
                    strokeDocIds.push(doc.id);
                    currentStrokes.push({ id: doc.id, points: points, author: data.author });
                }
            });
        }


            

    function createTextInput(x, y, existingData = null) {
        const boardContainer = canvas.parentElement;
        if (!boardContainer) return;

        // إزالة أي حقل نصي مؤقت سابق
        const oldInput = document.getElementById('tempTextInput');
        if (oldInput) oldInput.remove();

        const input = document.createElement('input');
        input.id = 'tempTextInput';
        input.type = 'text';
        input.placeholder = (currentLangLive === 'en') ? 'Type here...' : 'اكتب هنا...';
        input.value = existingData ? existingData.text : '';
        input.style.position = 'absolute';
        input.style.left = (x * canvas.offsetWidth) + 'px';
        input.style.top = (y * canvas.offsetHeight) + 'px';
        input.style.zIndex = '1000';
        input.style.fontSize = (existingData?.fontSize || 18) + 'px';
        input.style.color = existingData ? existingData.color : selectedColor;
        input.style.background = 'rgba(255,255,255,0.9)';
        input.style.border = `2px solid ${existingData ? existingData.color : selectedColor}`;
        input.style.padding = '4px';
        input.style.fontFamily = 'Cairo, sans-serif';
        input.style.outline = 'none';
        input.style.borderRadius = '4px';
        input.style.minWidth = '150px';

        boardContainer.appendChild(input);
        setTimeout(() => input.focus(), 10);

        let isSaved = false;

        // دالة لحفظ النص تلقائياً
        const saveTextAutomatically = () => {
            if (isSaved) return;
            isSaved = true;

            const text = input.value.trim();
            if (text !== '') {
                if (existingData) {
                    // تحديث نص موجود سابقاً عند التعديل
                    db.collection('sessions').doc(sessionId).collection('strokes').doc(existingData.id).update({
                        text: text
                    });
                } else {
                    // إضافة نص جديد
                db.collection('sessions').doc(sessionId).collection('strokes').add({
                    type: 'text',
                    dx: x,
                    dy: y,
                    text: text,
                    color: selectedColor,
                    fontSize: 18,
                    page: currentPageIndex,
                    author: currentUser.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                }
            } else if (existingData) {
                // إذا فرّغ النص بالكامل عند التعديل يتم حذفه
                db.collection('sessions').doc(sessionId).collection('strokes').doc(existingData.id).delete();
            }

            if (input.parentNode) input.remove();
            canvas.style.cursor = "text";
        };

        // حفظ عند كتابة أي تغيير بشكل لحظي أو عند الضغط خارج المربع (Blur)
        input.addEventListener('blur', saveTextAutomatically);

        // الحفظ وإلغاء التركيز أيضاً مع مفتاح Enter
        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                saveTextAutomatically();
            } else if (event.key === 'Escape') {
                isSaved = true;
                if (input.parentNode) input.remove();
                canvas.style.cursor = "text";
            }
        });
    }



            function eraseStrokeAt(x, y) {
                const px = x * canvas.width;
                const py = y * canvas.height;
                for (let i = 0; i < currentStrokes.length; i++) {
                    const stroke = currentStrokes[i];
                    let hit = false;
                    
                    if (stroke.type === 'text') {
                        const tx = stroke.dx * canvas.width;
                        const ty = stroke.dy * canvas.height;
                        ctx.font = `${stroke.fontSize || 18}px Cairo, sans-serif`;
                        const textWidth = ctx.measureText(stroke.text).width;
                        if (px >= tx && px <= tx + textWidth && py >= ty && py <= ty + (stroke.fontSize || 18)) {
                            hit = true;
                        }
                    } else if (stroke.type === 'shape') {
                        const sx = stroke.startX * canvas.width;
                        const sy = stroke.startY * canvas.height;
                        const ex = stroke.endX * canvas.width;
                        const ey = stroke.endY * canvas.height;
                        const minX = Math.min(sx, ex) - 10;
                        const maxX = Math.max(sx, ex) + 10;
                        const minY = Math.min(sy, ey) - 10;
                        const maxY = Math.max(sy, ey) + 10;
                        if (px >= minX && px <= maxX && py >= minY && py <= maxY) {
                            hit = true;
                        }
                    } else {
                        for (let j = 0; j < stroke.points.length; j++) {
                            const p = stroke.points[j];
                            const dist = Math.sqrt(Math.pow(px - p.dx * canvas.width, 2) + Math.pow(py - p.dy * canvas.height, 2));
                            if (dist < 20) {
                                hit = true;
                                break;
                            }
                        }
                    }
                    
                    if (hit) {
                        // 🔐 الطالب يقدر يمسح بس اللي رسمه هو؛ المعلم يقدر يمسح أي شي
                        if (!isTeacher && stroke.author !== currentUser.uid) {
                            continue; // مش ملكه، جرب الطبقة اللي تحتها بدل ما توقف البحث
                        }
                        db.collection('sessions').doc(sessionId).collection('strokes').doc(stroke.id).delete();
                        break;
                    }
                }
            }

        // ⚠️ عند الضغط على زر المسح العادي: تأكيد فقط، بدون خيار "حفظ كصورة" (لأن البيانات محفوظة أصلاً)
        function confirmClearBoard() {

                // ==========================================
        // 👆 بث حركة المؤشر لحظياً بين المعلم والطالب
        // ==========================================
        const POINTER_SEND_INTERVAL_MS = 100000000;   // أقصى معدل إرسال (~10 مرات بالثانية)
        const POINTER_HEARTBEAT_MS = 4000;      // تجديد الإشارة والمؤشر ثابت مكانه
        const REMOTE_POINTER_STALE_MS = 10000;  // لو انقطعت الإشارة نخفي المؤشر عند المستقبل

        let pendingPointerPos = null;
        let pointerFlushTimer = null;
        let pointerHeartbeat = null;
        let lastPointerPayload = null;
        let remotePointerHideTimer = null;
        let pointerErrorLogged = false;

        function pointerDocRef() {
            return db.collection('sessions').doc(sessionId).collection('live').doc(currentUser.uid);
        }

        // نفس معادلة حجم الإيموجي في مؤشر المعلم المحلي، عشان يبان بنفس الحجم عند الطالب
        function pointerFontPx(size) {
            return size * size * 0.008;
        }

        function publishPointer(x, y, visible) {
            if (!currentUser) return;
            lastPointerPayload = { x, y, visible };
            pointerDocRef().set({
                x, y, visible,
                emoji: pointerEmoji,
                size: pointerSize,
                by: currentUser.uid,
                seq: Date.now()
            }).catch((err) => {
                if (!pointerErrorLogged) {
                    pointerErrorLogged = true;
                    console.error('Pointer sync failed:', err);
                }
            });
        }

        function handlePointerMove(e) {
            if (!isPointerMode || !canDraw()) return;
            const pos = getMousePos(e);
            pendingPointerPos = {
                x: Math.min(1, Math.max(0, pos.x)),
                y: Math.min(1, Math.max(0, pos.y))
            };
            if (pointerFlushTimer) return;
            pointerFlushTimer = setTimeout(() => {
                pointerFlushTimer = null;
                if (pendingPointerPos && isPointerMode) {
                    publishPointer(pendingPointerPos.x, pendingPointerPos.y, true);
                    startPointerHeartbeat();
                }
            }, POINTER_SEND_INTERVAL_MS);
        }

        function startPointerHeartbeat() {
            if (pointerHeartbeat) return;
            pointerHeartbeat = setInterval(() => {
                if (lastPointerPayload && lastPointerPayload.visible && isPointerMode) {
                    publishPointer(lastPointerPayload.x, lastPointerPayload.y, true);
                }
            }, POINTER_HEARTBEAT_MS);
        }

        function stopPointerHeartbeat() {
            if (pointerHeartbeat) { clearInterval(pointerHeartbeat); pointerHeartbeat = null; }
        }

        // إخفاء مؤشري عند الطرف الآخر (خروج الماوس من السبورة، تغيير الأداة، إغلاق الصفحة)
        function hideMyPointer() {
            if (pointerFlushTimer) { clearTimeout(pointerFlushTimer); pointerFlushTimer = null; }
            pendingPointerPos = null;
            stopPointerHeartbeat();
            if (lastPointerPayload && lastPointerPayload.visible) {
                publishPointer(lastPointerPayload.x, lastPointerPayload.y, false);
            }
        }

        // استقبال مؤشر الطرف الآخر وعرضه على السبورة (نراقب المجموعة كلها، فيها بالأكثر وثيقتين: معلم وطالب)
        function listenToRemotePointer() {
            db.collection('sessions').doc(sessionId).collection('live').onSnapshot((snapshot) => {
                const el = document.getElementById('remotePointer');
                if (!el) return;

                snapshot.forEach((doc) => {
                    if (doc.id === currentUser.uid) return; // تجاهل وثيقتي أنا
                    const d = doc.data();
                    clearTimeout(remotePointerHideTimer);

                    if (!d.visible) { el.style.display = 'none'; return; }

                    el.innerText = d.emoji || '👆';
                    el.style.fontSize = pointerFontPx(d.size || 48) + 'px';
                    el.style.left = (d.x * 100) + '%';
                    el.style.top = (d.y * 100) + '%';
                    el.style.display = 'block';

                    remotePointerHideTimer = setTimeout(() => { el.style.display = 'none'; }, REMOTE_POINTER_STALE_MS);
                });
            }, (err) => console.error('Pointer listener error:', err));
        }



          // ==========================================
        // ⭐ نظام المكافآت: النجوم والميداليات والكأس

        const REWARD_SPRITE = '/static/images/rewards/rewards.svg';
        const SVG_NS = 'http://www.w3.org/2000/svg';

        // النجمة رقم (1..10) بالدورة: 1-3 للفضية، 4-6 للذهبية، 7-10 للكأس
        const REWARD_ORDER = ['silver', 'gold', 'cup'];
        const REWARD_ITEMS = {
            silver: {
                id: 'trophySilver', base: 'medalSilver', vb: [120, 170], first: 1, count: 3, size: 22,
                pos: [[28, 97], [49, 88], [70, 97]],

        let rewardQueue = [];
        let rewardBusy = false;
        let cupsCount = 0;
        let starsAwardedInSession = 0;
        let starsLimit = 3;
        let starCooldownTimer = null;

        function rwEl(id) { return document.getElementById(id); }
        function rwSleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        function rwAnimate(el, frames, opts) {
            const a = el.animate(frames, Object.assign({ fill: 'forwards' }, opts));
            const p = a.finished;
            p.catch(() => {});

        function rwReset(el) {

        function rewardKindFor(n) {

        // ---------- عمود الميداليات والكأس ----------
        function svgUse(id, transform) {
            const u = document.createElementNS(SVG_NS, 'use');
            u.setAttribute('href', `${REWARD_SPRITE}#${id}`);
            if (transform) u.setAttribute('transform', transform);
            return u;
        }

        function buildTrophyColumn() {
            const col = rwEl('rewardTrophies');
            if (!col || col.childElementCount) return;

            REWARD_ORDER.forEach((kind) => {
                const it = REWARD_ITEMS[kind];

                const box = document.createElement('div');

                const svg = document.createElementNS(SVG_NS, 'svg');
                svg.setAttribute('viewBox', `0 0 ${it.vb[0]} ${it.vb[1]}`);
                svg.appendChild(svgUse(it.base));

                const k = it.size / 100;
                for (let i = 0; i < it.count; i++) {
                    const x = it.pos[i][0];
                    const y = it.pos[i][1];
                    const tf = `translate(${x},${y}) scale(${k})`;

                    svg.appendChild(svgUse('starOutline', tf));

                    const g = document.createElementNS(SVG_NS, 'g');
                    g.setAttribute('id', `slot-${kind}-${i}`);
                    g.setAttribute('class', 'slot-fill');
                    const r = document.createElementNS(SVG_NS, 'rect');
                    r.setAttribute('x', x);
                    r.setAttribute('y', y);
                    r.setAttribute('width', it.size);
                    r.setAttribute('height', it.size);
                    r.setAttribute('fill', 'none');
                    g.appendChild(r);
                    g.appendChild(svgUse('starFaceted', tf));
                    svg.appendChild(g);

                box.appendChild(svg);

                if (kind === 'cup') {

        // position = عدد النجوم المعبّاة بالدورة الحالية (0..10)
        function renderTrophies(position) {
            let currentAssigned = false;
            REWARD_ORDER.forEach((kind) => {
                const it = REWARD_ITEMS[kind];
                const filled = Math.max(0, Math.min(it.count, position - (it.first - 1)));
                for (let i = 0; i < it.count; i++) {
                    const s = rwEl(`slot-${kind}-${i}`);
                    if (s) s.classList.toggle('on', i < filled);
                }
                const el = rwEl(it.id);
                if (!el) return;
                el.classList.remove('locked', 'current', 'done');
                if (filled >= it.count) {
                    el.classList.add('done');
                } else if (!currentAssigned) {
                    el.classList.add('current');
                    currentAssigned = true;
                } else {
                    el.classList.add('locked');
                }
            });
        }

        function fillSlot(kind, i) {
            const el = rwEl(`slot-${kind}-${i}`);
            if (!el) return;
            el.classList.add('on');
            el.classList.remove('pop');
            void el.getBoundingClientRect();
            el.classList.add('pop');
            setTimeout(() => el.classList.remove('pop'), 500);
        }

        function pulseTrophy(kind) {
            const el = rwEl(REWARD_ITEMS[kind].id);
            if (el) el.animate(
                [{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }],
                { duration: 600, easing: 'cubic-bezier(.2,.9,.3,1.3)' }
            );
        }

        function updateCupsBadge() {
            const b = rwEl('cupsBadge');

        // ---------- الأصوات (مولّدة بالكود، وبتتبدل بملفات mp3 لو وُجدت) ----------
        let rewardAudioCtx = null;
        const rewardSoundMissing = {};

        function getRewardCtx() {
            if (!rewardAudioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                rewardAudioCtx = new AC();
            }
            if (rewardAudioCtx.state === 'suspended') rewardAudioCtx.resume().catch(() => {});
            return rewardAudioCtx;
        }

        function unlockRewardAudio() { getRewardCtx(); }

        function rewardTone(freq, start, dur, type, vol) {
            const ac = getRewardCtx();
            if (!ac) return;
            const t0 = ac.currentTime + start;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, t0);
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.05);
        }

        function synthRewardSound(kind) {
            const sets = {
                star:   { notes: [988, 1319, 1760],                    gap: 0.09, dur: 0.45, vol: 0.18 },
                silver: { notes: [523, 659, 784, 1047],                gap: 0.13, dur: 0.6,  vol: 0.2 },
                gold:   { notes: [523, 659, 784, 1047, 1319],          gap: 0.12, dur: 0.7,  vol: 0.22 },
                cup:    { notes: [392, 523, 659, 784, 1047, 1319],     gap: 0.14, dur: 0.9,  vol: 0.24 }
            };
            const s = sets[kind];
            if (!s) return;
            s.notes.forEach((f, i) => {
                rewardTone(f, i * s.gap, s.dur, 'triangle', s.vol);
                rewardTone(f * 2, i * s.gap, s.dur * 0.6, 'sine', s.vol * 0.35);
            });
            if (kind === 'gold' || kind === 'cup') {
                const base = s.notes.length * s.gap + 0.05;
                [523, 659, 784, 1047].forEach(f => rewardTone(f, base, 1.2, 'triangle', 0.14));
            }
        }

        function playRewardSound(kind) {
            if (rewardSoundMissing[kind]) { synthRewardSound(kind); return; }
            let fell = false;
            const fallback = () => {
                if (fell) return;
                fell = true;
                rewardSoundMissing[kind] = true;
                synthRewardSound(kind);
            };
            try {
                const a = new Audio(`/static/sounds/rewards/${kind}.mp3`);
                a.addEventListener('error', fallback);
                const p = a.play();
                if (p && p.catch) p.catch((e) => { if (e && e.name === 'NotSupportedError') fallback(); });
            } catch (e) { fallback(); }
        }

        // ---------- الجسيمات (قصاصات ملونة) ----------
        function rewardBurst(count, spread, colors) {
            const stage = rwEl('rewardStage');
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'reward-particle';
                const size = 6 + Math.random() * 9;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = colors[i % colors.length];
                p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                stage.appendChild(p);
                const ang = Math.random() * Math.PI * 2;
                const dist = spread * (0.45 + Math.random() * 0.55);
                const dx = Math.cos(ang) * dist;
                const dy = Math.sin(ang) * dist + 40;
                const anim = p.animate([
                    { transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.3) rotate(${Math.random() * 540}deg)`, opacity: 0 }
                ], { duration: 900 + Math.random() * 800, easing: 'cubic-bezier(.15,.8,.3,1)' });
                anim.onfinish = () => p.remove();
            }
        }

        // ---------- مشهد النجمة: تظهر كبيرة ثم تطير لمكانها بالميدالية أو الكأس ----------
        async function rewardShowStar(kind, slotIndex) {
            const stage = rwEl('rewardStage');
            const star = rwEl('rewardBigStar');
            const cap = rwEl('rewardCaption');
            const backdrop = rwEl('rewardBackdrop');

            rwReset(star);
            [cap, backdrop].forEach(x => x.getAnimations().forEach(a => a.cancel()));
            cap.innerText = tl('reward_star_caption');
            cap.style.opacity = 0;
            backdrop.style.opacity = 0;
            stage.style.display = 'block';
            star.style.display = 'block';

            playRewardSound('star');
            rewardBurst(18, 220, ['#FFE777', '#F7B500', '#FFFFFF', '#FFB02E']);
            backdrop.animate([{ opacity: 0 }, { opacity: 0.45 }], { duration: 350, fill: 'forwards' });

            await rwAnimate(star, [
                { transform: 'scale(.1) rotate(-70deg)', opacity: 0 },
                { transform: 'scale(1.22) rotate(8deg)', opacity: 1, offset: 0.65 },
                { transform: 'scale(1) rotate(0deg)', opacity: 1 }
            ], { duration: 800, easing: 'cubic-bezier(.2,.9,.3,1)' });

            rwAnimate(cap, [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 300 });
            await rwSleep(850);

            // الطيران لمكان النجمة على الميدالية أو الكأس
            const slot = rwEl(`slot-${kind}-${slotIndex}`);
            const from = star.getBoundingClientRect();
            const to = slot ? slot.getBoundingClientRect() : from;
            const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
            const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
            const k = from.width ? Math.max(0.04, to.width / from.width) : 0.1;

            rwAnimate(cap, [{ opacity: 1 }, { opacity: 0 }], { duration: 250 });
            backdrop.animate([{ opacity: 0.45 }, { opacity: 0 }], { duration: 900, fill: 'forwards' });
            await rwAnimate(star, [
                { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 },
                { transform: `translate(${dx}px, ${dy}px) scale(${k}) rotate(360deg)`, opacity: 1 }
            ], { duration: 950, easing: 'cubic-bezier(.55,0,.25,1)' });

            star.style.display = 'none';
            fillSlot(kind, slotIndex);
            await rwSleep(350);
        }

        // ---------- مشهد اكتمال الميدالية أو الكأس ----------
        async function rewardShowMilestone(kind) {
            const cfg = REWARD_ITEMS[kind];
            if (!cfg) return;

            const stage = rwEl('rewardStage');
            const el = rwEl(cfg.big);
            const cap = rwEl('rewardCaption');

                { transform: 'scale(.15) rotate(-25deg)', opacity: 0 },
                { transform: 'scale(1.18) rotate(5deg)', opacity: 1, offset: 0.6 },

            ], { duration: 900, easing: 'cubic-bezier(.2,.9,.3,1)' });

            } else {
                await rwSleep(cfg.hold * 0.5);
                rewardBurst(24, 300, cfg.colors);

            pulse.cancel();
            rwAnimate(cap, [{ opacity: 1 }, { opacity: 0 }], { duration: 350 });
            backdrop.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' });
            rays.style.opacity = '0';
            await rwAnimate(el, [
                { transform: 'scale(1)', opacity: 1 },

        // ---------- تصفير الثلاثة بعد اكتمال الكأس ----------
        async function rewardResetTrophies() {
            for (let ki = REWARD_ORDER.length - 1; ki >= 0; ki--) {
                const kind = REWARD_ORDER[ki];
                const it = REWARD_ITEMS[kind];
                for (let i = it.count - 1; i >= 0; i--) {
                    const el = rwEl(`slot-${kind}-${i}`);
                    if (el) {
                        el.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.3)' }], { duration: 200, easing: 'ease-in' });
                        el.classList.remove('on');
                    }
                    await rwSleep(60);
                }
            }
            renderTrophies(0);
        }

        // ---------- التسلسل الكامل لحدث مكافأة ----------
        async function playRewardSequence(ev) {
            const total = ev.total;
            const n = ((total - 1) % STARS_PER_CYCLE) + 1;   // رقم النجمة بالدورة (1..10)
            const kind = rewardKindFor(n);
            const it = REWARD_ITEMS[kind];
            const slotIndex = n - it.first;
            const completed = slotIndex === it.count - 1;    // هاي النجمة بتكمّل الميدالية أو الكأس

            // نتأكد إنه الحالة مطابقة قبل ما نبدأ (حتى لو فاتنا حدث)
            cupsCount = Math.floor((total - 1) / STARS_PER_CYCLE);
            updateCupsBadge();
            renderTrophies(n - 1);

            await rewardShowStar(kind, slotIndex);
            if (completed) await rewardShowMilestone(kind);
            rwEl('rewardStage').style.display = 'none';

            renderTrophies(n);
            if (completed) pulseTrophy(kind);

            if (kind === 'cup' && completed) {
                await rwSleep(900);
                await rewardResetTrophies();
                cupsCount = Math.floor(total / STARS_PER_CYCLE);
                updateCupsBadge();
                const badge = rwEl('cupsBadge');
                if (badge) badge.animate(
                    [{ transform: 'scale(.4)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }],
                    { duration: 500, easing: 'cubic-bezier(.2,.9,.3,1.3)' }
                );
            }
        }

        function enqueueReward(ev) {
            rewardQueue.push(ev);
            if (!rewardBusy) processRewardQueue();
        }

        async function processRewardQueue() {
            rewardBusy = true;
            while (rewardQueue.length) {
                const ev = rewardQueue.shift();
                try {
                    await playRewardSequence(ev);
                } catch (e) {
                    console.error('Reward animation failed:', e);
                    rwEl('rewardStage').style.display = 'none';
                    renderTrophies(ev.total % STARS_PER_CYCLE);
                    cupsCount = Math.floor(ev.total / STARS_PER_CYCLE);
                    updateCupsBadge();
                }
            }
            rewardBusy = false;
        }

        // ---------- استقبال الأحداث من Firestore ----------
        let isInitialRewardLoad = true;
        function listenToRewards() {
            db.collection('sessions').doc(sessionId).collection('rewards')
                .orderBy('createdAt', 'desc').limit(1)
                .onSnapshot((snapshot) => {
                    if (isInitialRewardLoad) { isInitialRewardLoad = false; return; }
                    snapshot.docChanges().forEach((change) => {
                        if (change.type !== 'added') return;
                        const d = change.doc.data();
                        if (d && d.total) enqueueReward({ total: d.total, milestone: d.milestone || null });
                    });
                }, (err) => console.error('Rewards listener error:', err));
        }

        // ---------- الحالة الأولية عند دخول الحصة (من رد مسار join) ----------
        function initRewardsFromJoin(data) {
            const total = Number(data.studentStars || 0);
            if (!rewardBusy) {
                renderTrophies(total % STARS_PER_CYCLE);
                cupsCount = Math.floor(total / STARS_PER_CYCLE);
                updateCupsBadge();
            }
            starsAwardedInSession = Number(data.starsAwarded || 0);
            starsLimit = Number(data.starsLimit || 3);
            updateStarQuota();
        }

        // ---------- زر المعلم ----------
        function updateStarQuota() {
            const q = rwEl('starQuota');
            if (q) q.innerText = `${starsAwardedInSession}`;
        }

        function startStarCooldown(seconds) {

            async function fetchDynamicToken(channelName, uid) {
                try {
                    const response = await fetch(`https://agora-server-59qz.onrender.com/rtc-token?channelName=${channelName}&uid=${uid}`);
                    if (response.ok) return (await response.json()).token || '';

            async function initAgora() {
                try {
                    showSnackBar(tl('connecting_audio'), '#D97706');
                    const numericUid = Math.abs(hashCode(currentUser.uid)) % 100000;
                    const token = await fetchDynamicToken(sessionId, numericUid);
                    if (!token) throw new Error(tl('token_failed'));
                    agoraEngine = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
                    await agoraEngine.setClientRole("host");
                    
                    agoraEngine.on("user-published", async (user, mediaType) => {
                        await agoraEngine.subscribe(user, mediaType);
                        if (mediaType === "audio") {
                            user.audioTrack.play();
                            addRemoteAudioToMix(user.uid, user.audioTrack);
                        }
                        if (mediaType === "video") {
                            const numericUid = Math.abs(hashCode(currentUser.uid)) % 100000;
                            const myScreenShareUid = numericUid + 1000000;
                            
                            if (user.uid !== myScreenShareUid) {
                                screenShareUid = user.uid;
                                document.getElementById('screenShareContainer').style.display = 'flex';
                                const player = document.getElementById('screenSharePlayer');
                                player.innerHTML = ''; 
                                user.videoTrack.play('screenSharePlayer');
                            }
                        }
                    });
                    
                    agoraEngine.on("user-unpublished", (user, mediaType) => {
                        if (mediaType === "video") {
                            document.getElementById('screenShareContainer').style.display = 'none';
                            document.getElementById('screenSharePlayer').innerHTML = ''; 
                        }
                    });

                    await agoraEngine.join(AGORA_APP_ID, sessionId, token, numericUid);
                    let micId = undefined;
                    try {
                        await navigator.mediaDevices.getUserMedia({ audio: true });
                        const devices = await navigator.mediaDevices.enumerateDevices();
                        const audioInputs = devices.filter(d => d.kind === 'audioinput');
                        const invalidKeywords = ['stereo', 'mix', 'what u hear', 'wave out', 'loopback', 'system'];
                        const validMic = audioInputs.find(d => !invalidKeywords.some(kw => d.label.toLowerCase().includes(kw)));
                        if (validMic) micId = validMic.deviceId;
                    } catch (e) {}

                    let attempts = 0;
                    while (attempts < 3) {
                        try {
                            localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack({ microphoneId: micId, AEC: true, ANS: true, AGC: true });
                            break; 
                        } catch (micError) { attempts++; await new Promise(r => setTimeout(r, 1000)); }
                    }

                    if (localAudioTrack) {
                        await agoraEngine.publish([localAudioTrack]);
                        isMuted = false; updateMicUI();
                        showSnackBar(tl('audio_connected'), '#10b981');
                        initAudioMixGraph(localAudioTrack);
                        startAudioRecording();
                    } else { throw new Error(tl('mic_access_failed')); }
                } catch (e) { showSnackBar(`${tl('audio_connect_failed')} ${e.message}`, 'red'); }
            }
