<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>معاينة رسومات المكافآت</title>
<style>
  body { font-family: Cairo, Arial, sans-serif; background: #F4EFE6; padding: 24px; }
  h3 { margin: 24px 0 10px; }
  #status { background: #fff; border-radius: 12px; padding: 12px 16px; font-weight: bold; line-height: 1.8; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; }
  .card { background: #fff; border-radius: 16px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.1); font-weight: bold; }
  .board { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 16px 20px; display: inline-flex; flex-direction: column; gap: 6px; align-items: center; }
  svg { display: block; margin: 0 auto 6px; overflow: visible; }
  .locked  { filter: grayscale(.9) opacity(.55); }
  .current { filter: drop-shadow(0 0 10px rgba(255,190,0,.95)); }
  .done    { filter: drop-shadow(0 0 6px rgba(255,215,90,.7)); }
</style>
</head>
<body>
<div id="status">جاري فحص ملف الرسومات...</div>

<h3>1) الشكل الكبير (بيظهر على الشاشة لما تكتمل)</h3>
<div class="row" id="big"></div>

<h3>2) العمود الصغير داخل الحصة (الفضية مكتملة، الذهبية 2 من 3 وهي الهدف الحالي، الكأس مقفول)</h3>
<div class="board" id="col"></div>

<script>
  const SP = '/static/images/rewards/rewards.svg?v=' + Date.now();
  const NS = 'http://www.w3.org/2000/svg';

  const CFG = {
    silver: { vb: [120, 170], base: 'medalSilver', full: 'medalSilverFull', size: 22, pos: [[28, 97], [49, 88], [70, 97]] },
    gold:   { vb: [120, 170], base: 'medalGold',   full: 'medalGoldFull',   size: 22, pos: [[28, 97], [49, 88], [70, 97]] },
    cup:    { vb: [160, 190], base: 'cupTrophy',   full: 'cupFull',         size: 20, pos: [[36, 42], [59, 42], [82, 42], [105, 42]] }
  };

  function mk(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v));
    return e;
  }
  function use(id, tf) { return mk('use', Object.assign({ href: SP + '#' + id }, tf ? { transform: tf } : {})); }

  function bigVersion(kind, width) {
    const c = CFG[kind];
    const s = mk('svg', { width: width, height: width * c.vb[1] / c.vb[0], viewBox: `0 0 ${c.vb[0]} ${c.vb[1]}` });
    s.appendChild(use(c.full));
    return s;
  }
  function smallWidget(kind, filled, state, width) {
    const c = CFG[kind];
    const s = mk('svg', { width: width, height: width * c.vb[1] / c.vb[0], viewBox: `0 0 ${c.vb[0]} ${c.vb[1]}`, class: state });
    s.appendChild(use(c.base));
    c.pos.forEach((p, i) => s.appendChild(use(i < filled ? 'starFaceted' : 'starOutline', `translate(${p[0]},${p[1]}) scale(${c.size / 100})`)));
    return s;
  }
  function addCard(parent, label, svg) {
    const d = document.createElement('div');
    d.className = 'card';
    d.appendChild(svg);
    d.appendChild(document.createTextNode(label));
    parent.appendChild(d);
  }

  const big = document.getElementById('big');
  addCard(big, 'ميدالية فضية (3 نجوم)', bigVersion('silver', 150));
  addCard(big, 'ميدالية ذهبية (3 نجوم)', bigVersion('gold', 150));
  addCard(big, 'الكأس (4 نجوم)', bigVersion('cup', 170));

  const col = document.getElementById('col');
  col.appendChild(smallWidget('silver', 3, 'done', 100));
  col.appendChild(smallWidget('gold', 2, 'current', 100));
  col.appendChild(smallWidget('cup', 0, 'locked', 100));

  // فحص الملف نفسه
  const st = document.getElementById('status');
  fetch(SP)
    .then(r => { if (!r.ok) throw new Error('الملف غير موجود (HTTP ' + r.status + ')'); return r.text(); })
    .then(txt => {
      const doc = new DOMParser().parseFromString(txt, 'image/svg+xml');
      const err = doc.querySelector('parsererror');
      if (err) { st.innerHTML = '❌ ملف rewards.svg فيه خطأ بالكتابة:<br>' + err.textContent.slice(0, 300); return; }
      const ids = ['starFaceted', 'starOutline', 'medalSilver', 'medalGold', 'cupTrophy', 'medalSilverFull', 'medalGoldFull', 'cupFull'];
      const missing = ids.filter(id => !doc.querySelector('[id="' + id + '"]'));
      const dups = ids.filter(id => doc.querySelectorAll('[id="' + id + '"]').length > 1);
      let msg = '';
      if (missing.length) msg += '⚠️ عناصر ناقصة بالملف: ' + missing.join('، ') + '<br>';
      if (dups.length) msg += '⚠️ عناصر مكررة بالملف: ' + dups.join('، ') + '<br>';
      st.innerHTML = msg || '✅ الملف سليم وكل العناصر موجودة';
    })
    .catch(e => { st.textContent = '❌ ' + e.message; });
</script>
</body>
</html>
